<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicos Gym App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nicos Gym">
<meta name="theme-color" content="#0a0a0f">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');
:root{
  --bg:#0c0c12;--surface:#141420;--card:#1a1a28;--border:#252535;
  --red:#e63946;--orange:#f97316;--amber:#f59e0b;--green:#22c55e;
  --teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--gold:#fcd34d;
  --text:#f0f0f8;--muted:#6b7280;--muted2:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--red)}
.settings-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* phase tabs */
.phase-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.phase-row::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);white-space:nowrap;transition:all .15s}
.ptab.on{color:#fff;border-color:transparent}
.ptab[data-p=volume].on{background:var(--blue)}
.ptab[data-p=intensity].on{background:var(--orange)}
.ptab[data-p=strength].on{background:var(--red)}
.ptab[data-p=deload].on{background:var(--teal)}
.ptab[data-p=deload2].on{background:var(--purple)}

/* day tabs */
.day-row{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border)}
.day-row::-webkit-scrollbar{display:none}
.dtab{flex:1;min-width:72px;padding:10px 6px;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.dtab.on{color:var(--text);border-bottom-color:var(--red)}
.dtab b{font-size:13px;font-weight:700;display:block}

/* week strip */
.week-row{display:flex;align-items:center;gap:7px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border)}
.week-row::-webkit-scrollbar{display:none}
.wlbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0}
.wbtn{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.wbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.wbtn.logged::after{content:'';position:absolute;top:1px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}

/* ── SCROLLABLE CONTENT ── */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 90px}
.session-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;padding:0 2px}

/* exercise card */
.ex-card{background:var(--card);border-radius:14px;margin-bottom:9px;border:1px solid var(--border);overflow:hidden;transition:border-color .2s}
.ex-card.done{border-color:var(--green)}
.ex-card.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-header{display:flex;align-items:flex-start;gap:11px;padding:12px 13px 9px;cursor:pointer}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s}
.ex-card.done .chk{background:var(--green);border-color:var(--green)}
.chk svg{display:none}
.ex-card.done .chk svg{display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:7px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted2);border:1px solid var(--border)}
.pill.w{background:rgba(230,57,70,.14);color:var(--red);border-color:rgba(230,57,70,.28)}
.pill.r{background:rgba(59,130,246,.12);color:var(--blue);border-color:rgba(59,130,246,.25)}
.pill.s{background:rgba(252,211,77,.12);color:var(--gold);border-color:rgba(252,211,77,.25)}
.pill.p{background:rgba(107,114,128,.15);color:var(--muted2)}
.pill.pct{background:rgba(34,197,94,.12);color:var(--green);border-color:rgba(34,197,94,.25)}
.note-box{margin:0 13px 10px;padding:8px 10px;background:var(--surface);border-radius:8px;font-size:12px;color:var(--muted2);border-left:2px solid var(--amber);line-height:1.5}

/* log section */
.log-wrap{display:none;padding:0 13px 12px}
.ex-card.open .log-wrap{display:block}
.log-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.set-lbl{font-size:11px;font-weight:700;color:var(--muted);width:38px;flex-shrink:0;text-transform:uppercase}
.log-in{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:7px 8px;text-align:center;outline:none;transition:border-color .2s}
.log-in:focus{border-color:var(--red)}
.log-in::placeholder{color:var(--muted);font-weight:400}
.expand-row{padding:0 13px 10px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.expand-row svg{transition:transform .2s}
.ex-card.open .expand-row svg{transform:rotate(180deg)}

/* ── BOTTOM BAR ── */
.bot{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:200}
.prog-wrap{flex:1}
.prog-txt{font-size:11px;color:var(--muted);margin-bottom:5px}
.prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .35s}
.fin-btn{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

/* ── MODAL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 18px 40px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--gold);margin-bottom:16px}
.modal-close{float:right;background:var(--card);border:1px solid var(--border);color:var(--muted2);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.rm-field{background:var(--card);border-radius:12px;padding:12px}
.rm-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.rm-ex-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.3}
.rm-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.rm-sub{font-size:10px;color:var(--muted);width:28px;flex-shrink:0}
.rm-in{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;padding:6px 8px;text-align:center;outline:none}
.rm-in:focus{border-color:var(--red)}
.rm-calc{font-size:12px;color:var(--green);font-weight:600;margin-top:4px;min-height:16px}
.save-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.save-btn:active{opacity:.85}
.section-hdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.info-box{background:var(--card);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted2);line-height:1.6;margin-bottom:12px}
.info-box b{color:var(--text)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div class="app-title">Der Einzige Wahre Plan</div>
    <div class="settings-btn" onclick="openSettings()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
  </div>
  <div class="phase-row" id="phaseRow"></div>
  <div class="day-row" id="dayRow"></div>
  <div class="week-row" id="weekRow"></div>
</div>

<div class="scroll-area" id="scrollArea"></div>

<div class="bot">
  <div class="prog-wrap">
    <div class="prog-txt" id="progTxt">0 / 0 Übungen</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="overlay" onclick="closeSettings(event)">
  <div class="modal" id="modal">
    <div class="modal-title">⚙ XRM Einstellungen <button class="modal-close" onclick="closeSettings()">✕ Schliessen</button></div>
    <div class="info-box">
      Trage dein aktuelles <b>1RM (oder XRM)</b> pro Übung ein. Die App berechnet daraus automatisch alle Gewichte für alle Phasen und Wochen neu — exakt wie in deiner Excel-Formel.
    </div>
    <div id="rmFields"></div>
    <button class="save-btn" onclick="saveRM()">💾 Speichern & Zyklus neu berechnen</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// PLAN SCHEMA

// Config: { rm, repRM, pcts[], reps[], sets[], rest[], notes[] }
// Weight = rm * pct (rounded to nearest 0.5)
// ═══════════════════════════════════════════════════

const round05 = v => Math.round(v * 2) / 2;

  deadlift_bd:        {label:'Deadlift Back Down',         default:140},
  deadlift_str_bd:    {label:'Deadlift BD Strength',       default:217.5},
  deadlift_str_mid:   {label:'Classic DL Mittwoch (Str)',  default:140},
  deficit_dl:         {label:'Deficit Deadlift',           default:120},
  cg_bench:          {label:'Close Grip / Larsen Bench',   default:85},
  cg_bench_str:       {label:'Close Grip Strength',        default:136},
  ohp:               {label:'Overhead Press',              default:50},
  ohp_str:           {label:'OHP Strength',                default:36},
  incline_db:        {label:'Incline DB Press',            default:32},
  db_bench_str:      {label:'DB Bench (Strength)',         default:50},
  pl_row:            {label:'PL Row',                      default:70},
  pl_row_int:        {label:'PL Row (Intensity)',          default:85},
  wide_row:          {label:'Wide Grip Row',               default:62.5},
  wide_row_int:      {label:'Wide Grip Row (Int)',         default:70},
  latzug_vol_mon:    {label:'Latzug (Montag Vol)',         default:70},
  latzug_sat:        {label:'Latzug (Samstag Vol)',        default:100},
  latzug_int:        {label:'Latzug (Intensity)',          default:85},
  latzug_str:        {label:'Latzug (Strength)',           default:40},
  latzug_sat_int:    {label:'Latzug (Samstag Int)',        default:80},
  latpull_fri:       {label:'Lat Pull Down (Freitag)',     default:80},
  pullups:           {label:'Weighted Pullups (+kg)',       default:15},
  bicep_vol_mon:     {label:'Bizeps (Volume Mo)',          default:16},
  bicep_vol_fri:     {label:'Bizeps (Volume Fr)',          default:18},
  bicep_int:         {label:'Bizeps (Intensity Mo)',       default:18},
  bicep_int_fri:     {label:'Bizeps (Intensity Fr)',       default:35},
  bicep_str:         {label:'Bizeps (Strength Mo)',        default:38},
  bicep_str_fri:     {label:'Bizeps (Strength Fr)',        default:40},
  tricep:            {label:'Trizeps Extension',           default:20},
  lateral_vol:       {label:'Seitheben (Volume Mo)',       default:16},
  lateral_vol_fri:   {label:'Seitheben (Volume Fr)',       default:20},
  lateral_int:       {label:'Seitheben (Intensity)',       default:18},
  seitheben:         {label:'Seitheben (Intensity Fr)',    default:20},
  legpress:          {label:'Beinpresse',                  default:200},
  legpress_int:      {label:'Beinpresse (Intensity)',      default:220},
  legpress_str:      {label:'Beinpresse (Strength)',       default:40},
  calf_wed:          {label:'Calf Raise (Mittwoch)',       default:110},
  calf_sat:          {label:'Calf Raise (Samstag)',        default:90},
  calf_int:          {label:'Calf Raise (Int Mi)',         default:120},
  calf_sat_int:      {label:'Calf Raise (Int Sa)',         default:100},
  calf_str:          {label:'Calf Raise (Strength)',       default:126},
  plank:             {label:'Plank (gewichtet)',           default:25},
};

// ═══════════════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════════════
const LS = {
  get(k, def) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let state = {
  phase: LS.get('phase','volume'),
  day:   null,
  week:  LS.get('week',1),
  done:  {},   // {phase_day_week_idx: bool}
  logs:  {},   // {phase_day_week_idx_set: {w,r}}
  rms:   LS.get('rms', {}),
};

// Fill defaults for any missing RMs
Object.entries(RM_META).forEach(([k,v]) => { if (state.rms[k] == null) state.rms[k] = v.default; });

function saveState() {
  LS.set('phase', state.phase);
  LS.set('week',  state.week);
  LS.set('rms',   state.rms);
  LS.set('done',  state.done);
  LS.set('logs',  state.logs);
}

function calcWeight(rmKey, pct) {
  const rm = state.rms[rmKey] || 0;
  return round05(rm * pct);
}

function getDays() { return Object.keys(PHASES[state.phase].days); }
function getMaxWeeks() { return PHASES[state.phase].weeks; }
function getExs() { return state.day ? PHASES[state.phase].days[state.day].exercises : []; }
function getSession() { return state.day ? PHASES[state.phase].days[state.day].session : ''; }
function doneKey(idx) { return `${state.phase}_${state.day}_${state.week}_${idx}`; }
function logKey(idx, si) { return `${state.phase}_${state.day}_${state.week}_${idx}_${si}`; }
function weekHasLogs(w) {
  const prefix = `${state.phase}_${state.day}_${w}_`;
  return Object.keys(state.logs).some(k => k.startsWith(prefix) && state.logs[k]);
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function setPhase(p) {
  state.phase = p;
  const days = getDays();
  state.day = days[0];
  if (state.week > getMaxWeeks()) state.week = 1;
  saveState();
  renderAll();
}
function setDay(d) { state.day = d; saveState(); renderContent(); renderDayRow(); renderWeekRow(); }
function setWeek(w) { state.week = w; saveState(); renderContent(); renderWeekRow(); }

function renderAll() {
  renderPhaseRow();
  renderDayRow();
  renderWeekRow();
  renderContent();
}

function renderPhaseRow() {
  document.getElementById('phaseRow').innerHTML = Object.entries(PHASES).map(([k,v]) =>
    `<button class="ptab ${k===state.phase?'on':''}" data-p="${k}" onclick="setPhase('${k}')">${v.label}</button>`
  ).join('');
}

function renderDayRow() {
  const days = getDays();
  if (!state.day || !days.includes(state.day)) state.day = days[0];
  document.getElementById('dayRow').innerHTML = days.map(d =>
    `<button class="dtab ${d===state.day?'on':''}" onclick="setDay('${d}')"><b>${d.split(' ')[0]}</b>${d.includes('(')?d.match(/\(.*\)/)?.[0]??'':''}</button>`
  ).join('');
}

function renderWeekRow() {
  const max = getMaxWeeks();
  document.getElementById('weekRow').innerHTML = '<span class="wlbl">Woche</span>' +
    Array.from({length:max},(_,i)=>{
      const w=i+1, logged=weekHasLogs(w);
      return `<button class="wbtn ${w===state.week?'on':''} ${logged?'logged':''}" onclick="setWeek(${w})">${w}</button>`;
    }).join('');
}

function renderContent() {
  const exs = getExs();
  const wi = state.week - 1;
  const area = document.getElementById('scrollArea');
  if (!exs.length) { area.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">Kein Training</div>'; updateProg(); return; }

  area.innerHTML = `<div class="session-title">${getSession()}</div>` + exs.map((ex,idx) => {
    const pct  = ex.pcts[wi] ?? ex.pcts[0];
    const reps = ex.reps[wi] ?? ex.reps[0];
    const sets = ex.sets[wi] ?? ex.sets[0];
    const rest = ex.rest[wi] ?? ex.rest[0];
    const note = ex.notes ? (ex.notes[wi] ?? null) : null;
    const wt   = calcWeight(ex.rmKey, pct);
    const pctDisp = Math.round(pct*100)+'%';
    const dk   = doneKey(idx);
    const isDone = !!state.done[dk];
    const isOpen = false; // start collapsed
    const sCount = typeof sets==='string' ? parseInt(sets) : sets;

    const logRows = Array.from({length:isNaN(sCount)?3:sCount},(_,si)=>{
      const lk = logKey(idx,si);
      const saved = state.logs[lk];
      return `<div class="log-row">
        <span class="set-lbl">Satz ${si+1}</span>
        <input class="log-in" type="number" inputmode="decimal" step="0.5"
          placeholder="${wt} kg" value="${saved?.w??''}"
          onchange="saveLog(${idx},${si},'w',this.value)">
        <input class="log-in" type="number" inputmode="numeric"
          placeholder="${reps}" value="${saved?.r??''}" style="max-width:60px"
          onchange="saveLog(${idx},${si},'r',this.value)">
      </div>`;
    }).join('');

    return `<div class="ex-card ${isDone?'done':''}" id="ex-${idx}">
      <div class="ex-header" onclick="toggleOpen(${idx})">
        <div class="chk" onclick="toggleDone(event,${idx})">
          <svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="pills">
            <span class="pill w">⚖ ${wt} kg</span>
            <span class="pill r">✕ ${reps}</span>
            <span class="pill s">× ${sets}</span>
            <span class="pill p">⏱ ${rest}</span>
            <span class="pill pct">${pctDisp} · ${ex.repRM}RM</span>
          </div>
        </div>
      </div>
      ${note?`<div class="note-box">💡 ${note}</div>`:''}
      <div class="expand-row" onclick="toggleOpen(${idx})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        Gewicht loggen
      </div>
      <div class="log-wrap">${logRows}</div>
    </div>`;
  }).join('');
  updateProg();
}

function toggleOpen(idx) {
  const card = document.getElementById(`ex-${idx}`);
  card.classList.toggle('open');
}

function toggleDone(e, idx) {
  e.stopPropagation();
  const dk = doneKey(idx);
  state.done[dk] = !state.done[dk];
  saveState();
  const card = document.getElementById(`ex-${idx}`);
  card.classList.toggle('done', !!state.done[dk]);
  if (state.done[dk]) card.classList.remove('open');
  updateProg();
  renderWeekRow(); // refresh dot
}

function saveLog(idx, si, field, val) {
  const lk = logKey(idx, si);
  if (!state.logs[lk]) state.logs[lk] = {};
  state.logs[lk][field] = val;
  saveState();
  renderWeekRow(); // update dot
}

function updateProg() {
  const exs = getExs();
  const total = exs.length;
  const done = exs.filter((_,i) => !!state.done[doneKey(i)]).length;
  document.getElementById('progTxt').textContent = `${done} / ${total} Übungen`;
  document.getElementById('progFill').style.width = total ? (done/total*100)+'%' : '0%';
}

function finishWorkout() {
  const exs = getExs();
  const remaining = exs.length - exs.filter((_,i)=>!!state.done[doneKey(i)]).length;
  if (remaining > 0 && !confirm(`Noch ${remaining} Übungen offen. Trotzdem abschliessen?`)) return;
  exs.forEach((_,i) => { state.done[doneKey(i)] = true; });
  saveState();
  renderContent();
  renderWeekRow();
  setTimeout(() => alert('💪 Workout abgeschlossen! Sehr gut!'), 80);
}

// ═══════════════════════════════════════════════════
// SETTINGS MODAL
// ═══════════════════════════════════════════════════
// Build rmKey → repRM lookup from all exercises
function buildRepRMLookup() {
  const map = {};
  Object.values(PHASES).forEach(phase => {
    Object.values(phase.days).forEach(day => {
      day.exercises.forEach(ex => {
        if (map[ex.rmKey] == null) map[ex.rmKey] = ex.repRM;
      });
    });
  });
  return map;
}
const REP_RM_LOOKUP = buildRepRMLookup();

function openSettings() {
  // Build RM fields grouped by category
  const cats = [
    {label:'Bench', keys:['bench_primary','bench_secondary','bench_backdown_vol','bench_backdown_int','bench_bd_fri','bench_bd_str','bench_bd_str_fri']},
    {label:'Squat', keys:['squat','squat_backdown','squat_str_bd']},
    {label:'Deadlift', keys:['deadlift','deadlift_bd','deadlift_str_bd','deadlift_str_mid','deficit_dl']},
    {label:'Supplemental', keys:['cg_bench','cg_bench_str','ohp','ohp_str','incline_db','db_bench_str']},
    {label:'Rücken / Zug', keys:['pl_row','pl_row_int','wide_row','wide_row_int','latzug_vol_mon','latzug_sat','latzug_int','latzug_str','latzug_sat_int','latpull_fri','pullups']},
    {label:'Arme', keys:['bicep_vol_mon','bicep_vol_fri','bicep_int','bicep_int_fri','bicep_str','bicep_str_fri','tricep']},
    {label:'Schulter', keys:['lateral_vol','lateral_vol_fri','lateral_int','seitheben']},
    {label:'Beine / Waden / Core', keys:['legpress','legpress_int','legpress_str','calf_wed','calf_sat','calf_int','calf_sat_int','calf_str','plank']},
  ];

  let html = '';
  cats.forEach(cat => {
    html += `<div class="section-hdr">${cat.label}</div><div class="rm-grid">`;
    cat.keys.forEach(k => {
      const meta = RM_META[k];
      const cur  = state.rms[k] ?? meta.default;
      const repRM = REP_RM_LOOKUP[k] ?? '?';
      const rmLabel = repRM === 1 ? '1RM' : `${repRM}RM`;
      html += `<div class="rm-field">
        <div class="rm-label">${meta.label}</div>
        <div class="rm-row">
          <span class="rm-sub" style="width:36px;color:var(--gold);font-weight:700">${rmLabel}</span>
          <input class="rm-in" id="rm_${k}" type="number" inputmode="decimal" step="0.5" value="${cur}" oninput="previewRM('${k}')">
        </div>
        <div class="rm-calc" id="rmcalc_${k}"></div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('rmFields').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}

function previewRM(k) {
  const val = parseFloat(document.getElementById(`rm_${k}`).value);
  const el  = document.getElementById(`rmcalc_${k}`);
  if (isNaN(val)) { el.textContent = ''; return; }
  el.textContent = `75% → ${round05(val*.75)} kg  |  85% → ${round05(val*.85)} kg`;
}

function saveRM() {
  Object.keys(RM_META).forEach(k => {
    const el = document.getElementById(`rm_${k}`);
    if (el) {
      const v = parseFloat(el.value);
      if (!isNaN(v)) state.rms[k] = v;
    }
  });
  saveState();
  closeSettings();
  renderContent();
  alert('✓ XRM gespeichert! Alle Gewichte wurden neu berechnet.');
}

function closeSettings(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('show');
}


// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── INIT ──
const days = getDays();
state.day = days[0];
renderAll();
</script>
</body>
</html>
