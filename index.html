<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nicos Gym App</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nicos Gym">
<meta name="theme-color" content="#080810">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --card: #141420;
    --card2: #1a1a28;
    --border: #252535;
    --border2: #2e2e45;
    --accent: #e63946;
    --accent-glow: rgba(230,57,70,0.25);
    --accent2: #ff6b35;
    --gold: #f4c430;
    --gold-dim: rgba(244,196,48,0.15);
    --text: #eeeef8;
    --muted: #6a6a85;
    --muted2: #9090aa;
    --green: #2ec27e;
    --green-glow: rgba(46,194,126,0.2);
    --blue: #4a9eff;
    --teal: #14b8a6;
    --purple: #8b5cf6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(230,57,70,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230,57,70,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  .app-header {
    background: linear-gradient(180deg, #0d0d18 0%, #080810 100%);
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(230,57,70,0.4);
    box-shadow: 0 0 12px rgba(230,57,70,0.3);
  }

  .app-title-wrap {}
  .app-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2.5px;
    color: var(--text);
    line-height: 1;
  }
  .app-subtitle {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
    margin-top: 2px;
  }

  .phase-badge {
    background: linear-gradient(135deg, var(--accent), #c0303a);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 0 14px rgba(230,57,70,0.4);
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .phase-tabs::-webkit-scrollbar { display: none; }

  .phase-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .phase-tab.active { color: white; border-color: transparent; }
  .phase-tab[data-phase="volume"].active    { background: var(--blue); box-shadow: 0 0 12px rgba(74,158,255,0.35); }
  .phase-tab[data-phase="intensity"].active { background: var(--accent2); box-shadow: 0 0 12px rgba(255,107,53,0.35); }
  .phase-tab[data-phase="strength"].active  { background: var(--accent); box-shadow: 0 0 12px rgba(230,57,70,0.4); }
  .phase-tab[data-phase="deload"].active    { background: var(--teal); box-shadow: 0 0 12px rgba(20,184,166,0.35); }
  .phase-tab[data-phase="deload2"].active   { background: var(--purple); box-shadow: 0 0 12px rgba(139,92,246,0.35); }

  /* ── DAY TABS ── */
  .day-nav {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: relative;
    z-index: 1;
  }
  .day-nav::-webkit-scrollbar { display: none; }

  .day-btn {
    flex: 1;
    min-width: 80px;
    padding: 11px 8px;
    text-align: center;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .day-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    background: rgba(230,57,70,0.06);
  }
  .day-btn .day-label { font-size: 12px; font-weight: 700; display: block; margin-bottom: 1px; }

  /* ── WEEK SELECTOR ── */
  .week-bar {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-bar::-webkit-scrollbar { display: none; }
  .week-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    flex-shrink: 0;
  }
  .week-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--border2);
    background: transparent;
    color: var(--muted2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .week-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow: 0 0 12px rgba(230,57,70,0.5);
  }

  /* ── CONTENT ── */
  .content { padding: 12px 12px 90px; position: relative; z-index: 1; }

  .session-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 0 2px;
  }
  .session-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border2), transparent);
  }
  .session-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2.5px;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ── EXERCISE CARD ── */
  .ex-card {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: all 0.2s;
    position: relative;
  }
  .ex-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border2);
    transition: background 0.2s;
    border-radius: 14px 0 0 14px;
  }
  .ex-card.done {
    border-color: rgba(46,194,126,0.3);
    background: rgba(46,194,126,0.04);
    opacity: 0.75;
  }
  .ex-card.done::before { background: var(--green); }
  .ex-card.done .ex-name { text-decoration: line-through; color: var(--muted); }
  .ex-card.expanded { border-color: rgba(230,57,70,0.25); }
  .ex-card.expanded::before { background: var(--accent); }

  .ex-header {
    padding: 13px 14px 10px 17px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
  }

  .ex-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    background: transparent;
  }
  .ex-card.done .ex-check {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }
  .ex-check svg { display: none; }
  .ex-card.done .ex-check svg { display: block; }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 7px;
    color: var(--text);
    letter-spacing: 0.2px;
  }

  .ex-pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted2);
    border: 1px solid var(--border);
    letter-spacing: 0.3px;
  }
  .pill.weight { background: rgba(230,57,70,0.12); color: #ff7a83; border-color: rgba(230,57,70,0.25); }
  .pill.reps   { background: rgba(74,158,255,0.1); color: #7ab8ff; border-color: rgba(74,158,255,0.22); }
  .pill.sets   { background: rgba(244,196,48,0.1); color: #f4c430; border-color: rgba(244,196,48,0.22); }
  .pill.rest   { background: rgba(106,106,133,0.12); color: var(--muted2); border-color: var(--border); }
  .pill.pct    { background: rgba(46,194,126,0.1); color: #5de3a5; border-color: rgba(46,194,126,0.22); }

  /* ── NOTES ── */
  .ex-note {
    margin: 0 14px 10px 17px;
    padding: 7px 10px;
    background: rgba(244,196,48,0.07);
    border-radius: 8px;
    font-size: 11px;
    color: #c9a020;
    border-left: 2px solid var(--gold);
    line-height: 1.5;
  }

  /* ── LOG ── */
  .ex-log {
    padding: 0 14px 12px 17px;
    display: none;
  }
  .ex-card.expanded .ex-log { display: block; }

  .log-header {
    font-size: 9px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  .log-header span:first-child { width: 44px; flex-shrink: 0; }
  .log-header span { flex: 1; text-align: center; }
  .log-header span:last-child { max-width: 64px; }

  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .log-set-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    width: 44px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .log-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 10px;
    text-align: center;
    outline: none;
    transition: all 0.2s;
    -webkit-appearance: none;
  }
  .log-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(230,57,70,0.15);
  }
  .log-input::placeholder { color: var(--muted); font-weight: 400; }
  .log-input.reps-input { max-width: 64px; }

  .expand-btn {
    padding: 0 14px 10px 17px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }
  .expand-btn:hover { color: var(--muted2); }
  .expand-btn svg { transition: transform 0.2s; flex-shrink: 0; }
  .ex-card.expanded .expand-btn svg { transform: rotate(180deg); }
  .ex-card.expanded .expand-btn { color: var(--accent); }

  /* ── EMPTY ── */
  .empty-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-msg .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(8,8,16,0.92);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .progress-wrap { flex: 1; margin-right: 12px; }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }
  .progress-text { font-size: 11px; color: var(--muted2); font-weight: 600; }
  .progress-pct  { font-size: 11px; color: var(--green); font-weight: 700; }
  .progress-bar  { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #5de3a5); border-radius: 2px; transition: width 0.4s ease; }

  .finish-btn {
    background: linear-gradient(135deg, var(--accent), #c0303a);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 18px rgba(230,57,70,0.4);
    transition: all 0.2s;
  }
  .finish-btn:active { transform: scale(0.96); opacity: 0.9; }

  /* ── NUMBER INPUT ARROWS HIDE ── */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="header-left">
      <img class="app-icon" src="icon-192.png" alt="NG" onerror="this.style.display='none'">
      <div class="app-title-wrap">
        <div class="app-title">Nicos Gym App</div>
        <div class="app-subtitle">Der Einzige Wahre Plan</div>
      </div>
    </div>
    <div class="phase-badge" id="phaseBadge">Volume</div>
  </div>
  <div class="phase-tabs" id="phaseTabs">
    <button class="phase-tab active" data-phase="volume"    onclick="setPhase('volume')">Volume</button>
    <button class="phase-tab"        data-phase="intensity" onclick="setPhase('intensity')">Intensity</button>
    <button class="phase-tab"        data-phase="strength"  onclick="setPhase('strength')">Strength</button>
    <button class="phase-tab"        data-phase="deload"    onclick="setPhase('deload')">Deload 1</button>
    <button class="phase-tab"        data-phase="deload2"   onclick="setPhase('deload2')">Deload 2</button>
  </div>
</div>

<div class="day-nav"  id="dayNav"></div>
<div class="week-bar" id="weekBar"></div>
<div class="content"  id="content"></div>

<div class="bottom-bar">
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-text" id="progressText">0 / 0 Übungen</span>
      <span class="progress-pct"  id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="finish-btn" onclick="finishWorkout()">✓ Fertig</button>
</div>

<script>

// PLAN DATA
// ─────────────────────────────────────────────

// ─────────────────────────────────────────────
// STATE + STORAGE
// ─────────────────────────────────────────────
const STORAGE_KEY = 'nicosGymApp_v2';

function defaultState() {
  return { currentPhase:'volume', currentDay:null, currentWeek:1, doneByContext:{}, logsByContext:{} };
}
function loadAppState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch(e) { return defaultState(); }
}

let appState    = loadAppState();
let currentPhase = appState.currentPhase || 'volume';
let currentDay   = appState.currentDay;
let currentWeek  = appState.currentWeek  || 1;
let doneSet      = new Set();
let expandedSet  = new Set();

function getDays()      { return Object.keys(PLAN[currentPhase].days); }
function getMaxWeeks()  { return PLAN[currentPhase].weeks; }
function getExercises() { return currentDay ? PLAN[currentPhase].days[currentDay].exercises : []; }
function getSession()   { return currentDay ? PLAN[currentPhase].days[currentDay].session   : ''; }
function getContextKey(){ return `${currentPhase}__${currentDay}__week${currentWeek}`; }

function syncDoneSetFromStorage() {
  doneSet = new Set(appState.doneByContext[getContextKey()] || []);
}
function getLogsForContext() {
  const key = getContextKey();
  if (!appState.logsByContext[key]) appState.logsByContext[key] = {};
  return appState.logsByContext[key];
}
function saveAppState() {
  appState.currentPhase = currentPhase;
  appState.currentDay   = currentDay;
  appState.currentWeek  = currentWeek;
  appState.doneByContext[getContextKey()] = Array.from(doneSet).sort((a,b)=>a-b);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch(e) {}
}
function normaliseCurrentSelection() {
  const days = getDays();
  if (!days.includes(currentDay)) currentDay = days[0];
  const max = getMaxWeeks();
  if (currentWeek < 1 || currentWeek > max) currentWeek = 1;
}
function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function setPhase(p) {
  currentPhase = p;
  currentDay   = getDays()[0];
  currentWeek  = 1;
  expandedSet.clear();
  syncDoneSetFromStorage();
  saveAppState();
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.toggle('active', t.dataset.phase === p));
  const labels = { volume:'Volume', intensity:'Intensity', strength:'Strength', deload:'Deload 1', deload2:'Deload 2' };
  document.getElementById('phaseBadge').textContent = labels[p] || p;
  renderDayNav(); renderWeekBar(); renderContent();
}

function setDay(d) {
  currentDay = d;
  expandedSet.clear();
  syncDoneSetFromStorage();
  saveAppState();
  document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', b.dataset.day === d));
  renderContent();
}

function setWeek(w) {
  currentWeek = w;
  expandedSet.clear();
  syncDoneSetFromStorage();
  saveAppState();
  document.querySelectorAll('.week-btn').forEach(b => b.classList.toggle('active', +b.dataset.w === w));
  renderContent();
}

function renderDayNav() {
  const days = getDays();
  if (!days.includes(currentDay)) currentDay = days[0];
  document.getElementById('dayNav').innerHTML = days.map(d => {
    const parts = d.split(' ');
    const sub   = d.includes('(') ? d.match(/\(.*\)/)?.[0] : '';
    return `<button class="day-btn ${d===currentDay?'active':''}" data-day="${esc(d)}" onclick="setDay('${esc(d)}')">
      <span class="day-label">${parts[0]}</span>
      <span style="font-size:9px;color:var(--muted)">${sub}</span>
    </button>`;
  }).join('');
}

function renderWeekBar() {
  const max = getMaxWeeks();
  if (currentWeek > max) currentWeek = 1;
  document.getElementById('weekBar').innerHTML =
    `<span class="week-label">Woche</span>` +
    Array.from({length:max},(_,i) =>
      `<button class="week-btn ${currentWeek===i+1?'active':''}" data-w="${i+1}" onclick="setWeek(${i+1})">${i+1}</button>`
    ).join('');
}

function renderContent() {
  const exs  = getExercises();
  const wi   = currentWeek - 1;
  const logs = getLogsForContext();
  const el   = document.getElementById('content');

  if (!exs.length) {
    el.innerHTML = '<div class="empty-msg"><div class="empty-icon">💪</div>Kein Training für diesen Tag</div>';
    updateProgress(); return;
  }

  el.innerHTML = `
    <div class="session-header">
      <div class="session-line"></div>
      <div class="session-title">${esc(getSession())}</div>
      <div class="session-line" style="background:linear-gradient(90deg,transparent,var(--border2))"></div>
    </div>` +
    exs.map((ex, idx) => {
      const d = ex.weeks[wi] || ex.weeks[0];
      const isDone = doneSet.has(idx);
      const isExp  = expandedSet.has(idx);
      const rawSets = d.s;
      const sCount = typeof rawSets === 'string' && rawSets.includes('+DS')
        ? parseInt(rawSets)
        : (typeof rawSets === 'number' ? rawSets : parseInt(rawSets));
      const numSets = isNaN(sCount) ? 3 : sCount;
      const savedRows = logs[idx] || [];

      const logRows = Array.from({length: numSets}, (_,si) => {
        const sv = savedRows[si] || {};
        return `<div class="log-row">
          <span class="log-set-label">Satz ${si+1}</span>
          <input class="log-input" type="number" inputmode="decimal" step="0.5"
            placeholder="${esc(d.w)} kg" value="${esc(sv.weight??'')}"
            oninput="saveLog(${idx},${si},'weight',this.value)">
          <input class="log-input reps-input" type="number" inputmode="numeric"
            placeholder="${esc(d.r)}" value="${esc(sv.reps??'')}"
            oninput="saveLog(${idx},${si},'reps',this.value)">
        </div>`;
      }).join('');

      return `<div class="ex-card ${isDone?'done':''} ${isExp?'expanded':''}" id="ex-${idx}">
        <div class="ex-header" onclick="toggleExpand(${idx})">
          <div class="ex-check" onclick="toggleDone(event,${idx})">
            <svg width="11" height="9" viewBox="0 0 12 10" fill="none">
              <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="ex-info">
            <div class="ex-name">${esc(ex.name)}</div>
            <div class="ex-pills">
              <span class="pill weight">⚖ ${esc(d.w)} kg</span>
              <span class="pill reps">✕ ${esc(d.r)}</span>
              <span class="pill sets">× ${esc(d.s)} Sätze</span>
              <span class="pill rest">⏱ ${esc(d.rest)}</span>
              <span class="pill pct">${esc(d.pct)}</span>
            </div>
          </div>
        </div>
        ${d.note ? `<div class="ex-note">💡 ${esc(d.note)}</div>` : ''}
        <div class="expand-btn" onclick="toggleExpand(${idx})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
          Gewicht & Wdhl. loggen
        </div>
        <div class="ex-log">${logRows}</div>
      </div>`;
    }).join('');

  updateProgress();
}

function toggleExpand(idx) {
  expandedSet.has(idx) ? expandedSet.delete(idx) : expandedSet.add(idx);
  const c = document.getElementById(`ex-${idx}`);
  if (c) c.classList.toggle('expanded', expandedSet.has(idx));
}

function toggleDone(e, idx) {
  e.stopPropagation();
  doneSet.has(idx) ? doneSet.delete(idx) : doneSet.add(idx);
  const c = document.getElementById(`ex-${idx}`);
  if (c) {
    c.classList.toggle('done', doneSet.has(idx));
    if (doneSet.has(idx)) expandedSet.delete(idx);
    c.classList.toggle('expanded', expandedSet.has(idx));
  }
  saveAppState();
  updateProgress();
}

function saveLog(exIdx, setIdx, field, val) {
  const logs = getLogsForContext();
  if (!logs[exIdx]) logs[exIdx] = [];
  if (!logs[exIdx][setIdx]) logs[exIdx][setIdx] = {weight:'',reps:''};
  logs[exIdx][setIdx][field] = val;
  saveAppState();
}

function updateProgress() {
  const total = getExercises().length;
  const done  = doneSet.size;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressText').textContent = `${done} / ${total} Übungen`;
  document.getElementById('progressPct').textContent  = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';
}

function finishWorkout() {
  const remaining = getExercises().length - doneSet.size;
  if (remaining > 0 && !confirm(`Noch ${remaining} Übungen offen. Trotzdem abschliessen?`)) return;
  getExercises().forEach((_,i) => doneSet.add(i));
  document.querySelectorAll('.ex-card').forEach(c => c.classList.add('done'));
  saveAppState();
  updateProgress();
  setTimeout(() => alert('💪 Workout abgeschlossen! Gut gemacht, Nico!'), 100);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
normaliseCurrentSelection();
syncDoneSetFromStorage();
saveAppState();

const phaseLabels = { volume:'Volume', intensity:'Intensity', strength:'Strength', deload:'Deload 1', deload2:'Deload 2' };
document.getElementById('phaseBadge').textContent = phaseLabels[currentPhase] || currentPhase;
document.querySelectorAll('.phase-tab').forEach(t => t.classList.toggle('active', t.dataset.phase === currentPhase));

renderDayNav();
renderWeekBar();
renderContent();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
